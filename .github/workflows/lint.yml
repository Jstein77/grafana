# Fast Prettier check on files changed in a PR. No yarn install — meant for
# self-healing CI demos. Fieldsphere CI stays a separate banner-contract job.
name: Lint

on:
  push:
    branches-ignore:
      - main
      - 'release-*.*.*'
  pull_request:
    branches:
      - main
      - 'release-*.*.*'

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PRETTIER_EXTENSIONS: '\.(ts|tsx|js|jsx|mjs|cjs|json|css|scss|md|yml|yaml)$'

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Same-repo branches are covered by the push event; only fork PRs, which
    # never emit push here, need the pull_request run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Collect changed files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "${PR_NUMBER}" ]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename' > all-changed.txt
          else
            # Whole-branch comparison, not just this push, so a commit that
            # touches nothing still re-reports outstanding formatting problems.
            # Asking the API avoids fetching history for a shallow checkout.
            gh api --paginate "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" \
              --jq '.files[].filename' > all-changed.txt
          fi
          grep -E "${PRETTIER_EXTENSIONS}" all-changed.txt > changed.txt || true
      - name: Prettier check (changed files)
        run: |
          set -euo pipefail
          existing=()
          while IFS= read -r f; do
            if [ -f "$f" ]; then
              existing+=("$f")
            fi
          done < changed.txt
          if [ ${#existing[@]} -eq 0 ]; then
            echo "No Prettier-eligible files changed"
            exit 0
          fi
          echo "Checking ${#existing[@]} file(s):"
          printf '  %s\n' "${existing[@]}"
          npx --yes prettier@3.6.2 --check -- "${existing[@]}"
