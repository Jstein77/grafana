# Fast Prettier check on files changed in a PR or pushed to a branch. No yarn
# install — meant for self-healing CI demos. Fieldsphere CI stays a separate
# banner-contract job.
name: Lint

on:
  pull_request:
    branches:
      - main
      - 'release-*.*.*'
  push:
    branches:
      - '**'

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Prettier check (changed files)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                --jq '.[].filename'
            )
          else
            git fetch --no-tags origin main
            base=$(git merge-base FETCH_HEAD HEAD)
            changed=$(git diff --name-only "$base"...HEAD)
          fi
          mapfile -t files < <(
            printf '%s\n' "$changed" \
            | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|css|scss|md|yml|yaml)$' || true
          )
          existing=()
          for f in "${files[@]+"${files[@]}"}"; do
            if [ -f "$f" ]; then
              existing+=("$f")
            fi
          done
          if [ ${#existing[@]} -eq 0 ]; then
            echo "No Prettier-eligible files changed"
            exit 0
          fi
          echo "Checking ${#existing[@]} file(s):"
          printf '  %s\n' "${existing[@]}"
          npx --yes prettier@3.6.2 --check -- "${existing[@]}"
