# Fieldsphere fork: demo CI only. One fast job so cloud agents can watch
# checks go red then green without waiting on Grafana's full test matrix.
name: Fieldsphere CI

on:
  pull_request:
    branches:
      - main
      - 'release-*.*.*'
  push:
    branches:
      - main
      - 'release-*.*.*'

concurrency:
  group: fieldsphere-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  environment-banner:
    name: Environment banner contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check environment banner contract
        run: python3 scripts/ci/check-environment-banner.py
